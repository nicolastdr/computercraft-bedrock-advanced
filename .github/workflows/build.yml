name: Build Addon

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build addon
        run: npm run build
      - name: Upload mcaddon
        uses: actions/upload-artifact@v4
        with:
          name: ComputerCraft-Bedrock-Advanced
          path: dist/ComputerCraft-Bedrock-Advanced.mcaddon
